[build-system]
requires = [
  "setuptools>=69", 
  "wheel", 
  "numpy"
  ]
build-backend = "setuptools.build_meta"

[project]
name = "smudgy"
version = "0.2.0"
description = "Point Cloud smoothing and interpolation package with Numpy and Taichi backends."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy", 
  "scipy", 
  "taichi",
  "mpi4py",
  "tqdm"
  ]

authors = [
    { name = "Mauro Bernardini"}, 
    { email = "mauro.bernardini1313@gmail.com" }
    ]
maintainers = [
  { name = "Mauro Bernardini" },
  { email = "mauro.bernardini1313@gmail.com" }
]

[project.urls]
Homepage = "https://github.com/maurbe/smudgy"
Repository = "https://github.com/maurbe/smudgy"
Documentation = "https://smudgy.readthedocs.io/en/latest/start/quickstart.html"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["smudgy*"]

[tool.pytest.ini_options]
testpaths = ["smudgy/tests"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.ruff]
extend-exclude = ["smudgy/tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "UP"]
ignore = ["E501", "D203", "D213"]
