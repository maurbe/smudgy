name: Build Wheels and Publish to PyPI

on:
  release:
    types: [created]

jobs:
  # ==========================================================
  # Build wheel + sdist
  # ==========================================================
  build-wheels:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ------------------------------------------------------
      # Build wheel + sdist
      # ------------------------------------------------------
      # smudgy is pure Python (Taichi is a runtime dependency, not
      # compiled here), so a plain build is used instead of cibuildwheel,
      # which refuses to run when no platform wheel is produced.
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      # ------------------------------------------------------
      # Upload artifacts
      # ------------------------------------------------------
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # ==========================================================
  # Publish to PyPI
  # ==========================================================
  publish-to-pypi:
    name: Publish Wheels to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write

    steps:
      # ------------------------------------------------------
      # Download wheel artifacts
      # ------------------------------------------------------
      - name: Download built wheels
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      # ------------------------------------------------------
      # Collect wheels
      # ------------------------------------------------------
      - name: Collect wheels into dist/
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec mv {} dist/ \;

      # ------------------------------------------------------
      # Show distributions
      # ------------------------------------------------------
      - name: Show built distributions
        run: ls -lh dist/

      # ------------------------------------------------------
      # Publish to PyPI
      # ------------------------------------------------------
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1