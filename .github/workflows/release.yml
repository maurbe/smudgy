name: Build and Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ==========================================================
  # Gate: full CI matrix (all OS x all Python versions, incl. MPI)
  # ==========================================================
  tests:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ==========================================================
  # Build wheel + sdist
  # ==========================================================
  build:
    name: Build distributions
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check tag matches package version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${TAG#v}" != "${version}" ]; then
            echo "::error::Release tag '${TAG}' does not match pyproject version '${version}'"
            exit 1
          fi

      # smudgy is pure Python (Quadrants is a runtime dependency, not
      # compiled here), so a plain build is used instead of cibuildwheel.
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke-test the wheel in a clean venv
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv smoke
          smoke/bin/python -m pip install "${GITHUB_WORKSPACE}"/dist/*.whl
          smoke/bin/python -c "import smudgy; from smudgy.backend.quadrants import init; init(arch='cpu'); print('ok', smudgy.__file__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # ==========================================================
  # Publish to PyPI (trusted publishing)
  # ==========================================================
  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Show distributions
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
