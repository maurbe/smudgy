name: Build Wheels and Publish to PyPI

on:
  release:
    types: [created]

jobs:
  # ==========================================================
  # Build wheels (Linux + macOS + Windows)
  # ==========================================================
  build-wheels:
    name: Build Wheels (${{ matrix.os }}${{ matrix.arch && format(' ({0})', matrix.arch) || '' }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest

          # Windows
          - os: windows-latest

          # macOS Intel
          - os: macos-15-intel
            arch: x86_64

          # macOS Apple Silicon
          - os: macos-14
            arch: arm64

    steps:
      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ------------------------------------------------------
      # Set up Python
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ------------------------------------------------------
      # macOS: Install OpenMP
      # ------------------------------------------------------
      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          OMP_PREFIX="$(brew --prefix libomp)"
          echo "OMP_PREFIX=${OMP_PREFIX}" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I${OMP_PREFIX}/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L${OMP_PREFIX}/lib -Wl,-rpath,${OMP_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "CFLAGS=-Xpreprocessor -fopenmp -I${OMP_PREFIX}/include" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-Xpreprocessor -fopenmp -I${OMP_PREFIX}/include" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=${OMP_PREFIX}/lib" >> "$GITHUB_ENV"

      # ------------------------------------------------------
      # Install delocate (macOS)
      # ------------------------------------------------------
      - name: Install delocate (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install delocate

      # ------------------------------------------------------
      # Build wheels via cibuildwheel
      # ------------------------------------------------------
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # Build CPython wheels only
          CIBW_BUILD: "cp3*-*"

          # Architecture selection
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ARCHS_WINDOWS: "AMD64"

          # Deployment target
          MACOSX_DEPLOYMENT_TARGET: "11.0"

          # Skip musllinux unless needed
          CIBW_SKIP: "*-musllinux_*"

          # macOS wheel repair
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            delocate-wheel
            --require-archs {delocate_archs}
            -w {dest_dir}
            -v {wheel}

      # ------------------------------------------------------
      # Upload artifacts
      # ------------------------------------------------------
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: wheelhouse/*.whl

  # ==========================================================
  # Publish to PyPI
  # ==========================================================
  publish-to-pypi:
    name: Publish Wheels to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write

    steps:
      # ------------------------------------------------------
      # Download all wheel artifacts
      # ------------------------------------------------------
      - name: Download built wheels
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      # ------------------------------------------------------
      # Collect wheels into dist/
      # ------------------------------------------------------
      - name: Collect wheels into dist/
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec mv {} dist/ \;

      # ------------------------------------------------------
      # Show distributions
      # ------------------------------------------------------
      - name: Show built distributions
        run: ls -lh dist/

      # ------------------------------------------------------
      # Publish to PyPI
      # ------------------------------------------------------
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1