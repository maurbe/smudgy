name: Build Wheels and Publish to PyPI

on:
  release:
    types: [created]

jobs:
  # ==========================================================
  # Build wheels
  # ==========================================================
  build-wheels:
    name: Build Wheels (${{ matrix.os }}${{ matrix.arch && format(' ({0})', matrix.arch) || '' }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest

          # Windows
          - os: windows-latest

          # macOS Intel
          - os: macos-15-intel
            arch: x86_64

          # macOS Apple Silicon
          - os: macos-14
            arch: arm64

    steps:
      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ------------------------------------------------------
      # Build wheels
      # ------------------------------------------------------
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # Build CPython wheels only
          CIBW_BUILD: "cp3*-*"

          # Explicit architectures
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ARCHS_WINDOWS: "AMD64"

          # macOS target
          MACOSX_DEPLOYMENT_TARGET: "11.0"

          # Skip musllinux
          CIBW_SKIP: "*-musllinux_*"

          # Install OpenMP inside wheel env
          CIBW_BEFORE_BUILD_MACOS: "brew install libomp"

          # Prevent accidental universal2 builds
          CIBW_ENVIRONMENT_MACOS: >
            ARCHFLAGS="-arch ${{ matrix.arch }}"
            CMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}"

          # Repair macOS wheels
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            delocate-wheel
            --require-archs {delocate_archs}
            -w {dest_dir}
            -v {wheel}

      # ------------------------------------------------------
      # Upload artifacts
      # ------------------------------------------------------
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: wheelhouse/*.whl

  # ==========================================================
  # Publish to PyPI
  # ==========================================================
  publish-to-pypi:
    name: Publish Wheels to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write

    steps:
      # ------------------------------------------------------
      # Download wheel artifacts
      # ------------------------------------------------------
      - name: Download built wheels
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      # ------------------------------------------------------
      # Collect wheels
      # ------------------------------------------------------
      - name: Collect wheels into dist/
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec mv {} dist/ \;

      # ------------------------------------------------------
      # Show distributions
      # ------------------------------------------------------
      - name: Show built distributions
        run: ls -lh dist/

      # ------------------------------------------------------
      # Publish to PyPI
      # ------------------------------------------------------
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1