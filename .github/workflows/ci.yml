name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up MPI
        uses: mpi4py/setup-mpi@v1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run tests
        run: |
          python -c "import os, subprocess, sys, tempfile; os.chdir(tempfile.gettempdir()); sys.exit(subprocess.call([sys.executable, '-m', 'pytest', '-rs', os.path.join(os.environ['GITHUB_WORKSPACE'], 'smudgy', 'tests')]))"
